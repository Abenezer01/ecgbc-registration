packages:
  - "apps/backend"
  - "apps/admin-portal"
  - "apps/church-portal"
overrides:
  proxy-addr: ">=2.0.8"
  dompurify: ">=3.4.17"
  handlebars: ">=4.7.10"
  shell-quote: ">=1.11.0"
  follow-redirects: ">=1.16.2"
  body-parser: ">=1.20.9"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@next/env@16.4.4"
  - "@next/eslint-plugin-next@16.4.4"
  - "@next/swc-darwin-arm64@16.4.4"
  - "@next/swc-darwin-x64@16.4.4"
  - "@next/swc-linux-arm64-gnu@16.4.4"
  - "@next/swc-linux-arm64-musl@16.4.4"
  - "@next/swc-linux-x64-gnu@16.4.4"
  - "@next/swc-linux-x64-musl@16.4.4"
  - "@next/swc-win32-arm64-msvc@16.4.4"
  - "@next/swc-win32-x64-msvc@16.4.4"
  - eslint-config-next@16.4.4
  - next@16.4.4
