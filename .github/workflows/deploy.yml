name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /path/to/your/project/on/vps || exit 1
            
            # Pull the latest changes
            git pull origin main
            
            # Generate the backend .env file
            cat << 'EOF' > apps/backend/.env
            JWT_ACCESS_SECRET_KEY="${{ secrets.JWT_ACCESS_SECRET_KEY }}"
            JWT_REFRESH_SECRET_KEY="${{ secrets.JWT_REFRESH_SECRET_KEY }}"
            JWT_ACCESS_EXPIRES_IN="${{ secrets.JWT_ACCESS_EXPIRES_IN }}"
            JWT_REFRESH_EXPIRES_IN="${{ secrets.JWT_REFRESH_EXPIRES_IN }}"
            PORT="${{ secrets.PORT }}"
            NODE_ENV="${{ secrets.NODE_ENV }}"
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            DB_ROOT_PASSWORD="${{ secrets.DB_ROOT_PASSWORD }}"
            DB_NAME="${{ secrets.DB_NAME }}"
            DB_USER="${{ secrets.DB_USER }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            DB_PORT="${{ secrets.DB_PORT }}"
            SUPER_ADMIN_EMAIL="${{ secrets.SUPER_ADMIN_EMAIL }}"
            SUPER_ADMIN_PASSWORD="${{ secrets.SUPER_ADMIN_PASSWORD }}"
            PAYMENT_VERIFY_API_KEY="${{ secrets.PAYMENT_VERIFY_API_KEY }}"
            EOF
            
            # Generate the church portal .env.local file
            cat << 'EOF' > apps/church-portal/.env.local
            NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
            EOF
            
            # (Optional) Generate the admin portal .env.local file if needed
            cat << 'EOF' > apps/admin-portal/.env.local
            NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
            EOF
            
            # Start up the containers via Docker Compose
            # (Assuming you run from the apps/backend directory or root depending on your setup)
            cd apps/backend
            docker-compose up -d --build
